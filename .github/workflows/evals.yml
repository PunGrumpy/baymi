name: Evals

# Evals drive the agent against the live model, so every run spends
# Anthropic credit. The triggers are narrow on purpose: a pull request that
# changes the agent's behavior, or a manual run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag filter
        required: false
        default: fast
        type: string
  pull_request:
    paths:
      - agent/instructions.md
      - agent/instructions/**
      - agent/skills/**
      - agent/agent.ts
      - agent/lib/env.ts
      - agent/lib/model.ts
      - evals/**

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run evals
    # Drafts never spend model budget, and `skip-evals` is the escape hatch for
    # a pull request that touched a watched path without changing behavior.
    if: >
      github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-evals'))
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_CONNECTOR: ${{ vars.GITHUB_CONNECTOR }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
      SLACK_CONNECTOR: ${{ vars.SLACK_CONNECTOR }}
      TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The eve CLI runs on Node, not on Bun, and refuses anything below 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The root agent calls Anthropic with its own key, and the judge needs its
      # TypeSafe key. Without either, calls fail for a reason that says nothing
      # about the agent, so report it as a skip.
      - name: Check for model credentials
        id: credentials
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="ANTHROPIC_API_KEY"
          [ -z "$TYPESAFE_AI_API_KEY" ] && missing="${missing:+$missing or }TYPESAFE_AI_API_KEY"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Evals skipped::This repository has no $missing secret, so the suite cannot run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evals
        if: steps.credentials.outputs.configured == 'true'
        run: bun run eval --strict --tag "${{ inputs.tag || 'fast' }}" --junit .eve/junit.xml

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: .eve/evals/
          if-no-files-found: ignore
